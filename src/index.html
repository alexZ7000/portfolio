<!doctype html>
<html lang="en">
    <head id="link-by-user-theme">
        <meta charset="UTF-8" />

        <meta

        <style>
            .noscript-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(20, 20, 20, 0.95);
                color: #fff;
                display: flex;
                justify-content: center;

            .noscript-content {
                max-width: 600px;
                padding: 2rem;
            }
            .noscript-content h1 {
                font-size: 2rem;
                margin-bottom: 1rem;
            }
            .noscript-content p {
                font-size: 1.2rem;
                line-height: 1.6;
            }
        </style>
