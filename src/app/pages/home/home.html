<main id="main" class="home">
    <app-embers-background aria-hidden="true"></app-embers-background>

    <app-hero></app-hero>
    <app-about-me></app-about-me>

    @defer (on viewport; prefetch on idle) {
        <app-work-experience></app-work-experience>
    } @placeholder {
        <div class="home__section-placeholder" aria-hidden="true"></div>
    }

    @defer (on viewport; prefetch on idle) {
        <app-certificates></app-certificates>
    } @placeholder {
        <div class="home__section-placeholder" aria-hidden="true"></div>
    }

    @defer (on viewport; prefetch on idle) {
        <app-contact></app-contact>
    } @placeholder {
        <div class="home__section-placeholder" aria-hidden="true"></div>
    }

    @defer (on viewport; prefetch on idle) {
        <app-footer></app-footer>
    } @placeholder {
        <div class="home__footer-placeholder" aria-hidden="true"></div>
    }
</main>
