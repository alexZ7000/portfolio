<section id="certificates" class="certs section-pad" aria-labelledby="certs-title">
    <header class="certs__header section-header">
        <h2 id="certs-title" class="section-title">
            <fa-icon
                [icon]="['fas', 'dragon']"
                class="certs__title-icon title-icon"
                aria-hidden="true"
            ></fa-icon>
            {{ 'certificatesTitle' | translate }}
        </h2>
        <p class="certs__subtitle">{{ 'certificatesSubtitle' | translate }}</p>
    </header>

    <ul class="certs__grid auto-grid auto-grid--3" role="list">
        @for (cert of certificates; track cert.name; let i = $index) {
            <li
                class="cert-card-wrapper"
                [appReveal]="'up'"
                [revealDelay]="i * 120"
                (mouseenter)="onMouseEnter(i)"
                (mousemove)="onMouseMove($event, i)"
                (mouseleave)="onMouseLeave(i)"
            >
                <article
                    #cardRef
                    class="cert-card panel panel--strong"
                    tabindex="0"
                    role="button"
                    [attr.aria-label]="cert.name + ' — ' + cert.issuer"
                    (click)="openCertificate(cert.link)"
                    (keydown.enter)="openCertificate(cert.link)"
                    (keydown.space)="openCertificate(cert.link)"
                >
                    <span #glareRef class="cert-card__glare" aria-hidden="true"></span>

                    <div class="cert-card__body">
                        <div class="cert-card__badge" aria-hidden="true">
                            <fa-icon [icon]="['fas', 'scroll']"></fa-icon>
                        </div>

                        <h3 class="cert-card__title">{{ cert.name }}</h3>
                        <p class="cert-card__issuer">{{ cert.issuer }}</p>
                        <time class="cert-card__date">{{ cert.date }}</time>

                        <span class="cert-card__cta">
                            <span>{{ 'viewCertificate' | translate }}</span>
                            <fa-icon
                                [icon]="['fas', 'arrow-up-right-from-square']"
                                aria-hidden="true"
                            ></fa-icon>
                        </span>
                    </div>

                    <span class="cert-card__corner cert-card__corner--tl" aria-hidden="true"></span>
                    <span class="cert-card__corner cert-card__corner--br" aria-hidden="true"></span>
                </article>
            </li>
        }
    </ul>
</section>
