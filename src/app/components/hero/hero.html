<section id="home" class="hero" aria-labelledby="hero-title">
    <div class="hero__dragon">
        <app-dragon-animation></app-dragon-animation>
    </div>

    <div class="hero__content">
        <p class="hero__eyebrow">{{ 'heroEyebrow' | translate }}</p>
        <h1 id="hero-title" class="hero__title background-animate">
            {{ 'heroTitle' | translate }}
        </h1>
        <p class="hero__subtitle">{{ 'subText' | translate }}</p>

        <div class="hero__actions">
            <button type="button" class="btn btn--primary" (click)="scrollToContact()">
                <span>{{ 'contactButton' | translate }}</span>
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
            <button type="button" class="btn btn--ghost" (click)="breatheFire()">
                <i class="fa-solid fa-fire" aria-hidden="true"></i>
                <span>{{ 'breatheFire' | translate }}</span>
            </button>
        </div>

        <div class="hero__scroll-hint" aria-hidden="true">
            <span class="hero__scroll-line"></span>
            <span class="hero__scroll-text">scroll</span>
        </div>
    </div>
</section>
