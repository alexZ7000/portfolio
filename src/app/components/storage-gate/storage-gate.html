@if (blocked()) {
    <div
        class="storage-gate"
        role="alertdialog"
        aria-labelledby="storage-gate-title"
        aria-describedby="storage-gate-body"
    >
        <div class="storage-gate__panel">
            <fa-icon
                [icon]="['fas', 'shield-halved']"
                class="storage-gate__icon"
                aria-hidden="true"
            ></fa-icon>
            <h1 id="storage-gate-title" class="storage-gate__title">{{ copy().title }}</h1>
            <p id="storage-gate-body" class="storage-gate__body">{{ copy().body }}</p>
            <button type="button" class="storage-gate__retry" (click)="retry()">
                <fa-icon [icon]="['fas', 'rotate-right']" aria-hidden="true"></fa-icon>
                {{ copy().retry }}
            </button>
        </div>
    </div>
}
