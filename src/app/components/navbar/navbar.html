<header class="navbar" [class.is-scrolled]="isScrolled()" [class.is-menu-open]="isMobileMenuOpen()">
    <div class="navbar__inner">
        <!--
            A marca agora e o dragao em SVG (branco no tema escuro, preto no
            claro) com o nome ao lado em Cinzel, a mesma display font dos titulos
            das secoes. Antes era um PNG de 1200px com o nome ja rasterizado
            dentro: pesava mais, borrava em tela de alta densidade e nao
            acompanhava o tema. O nome acessivel vem do aria-label do botao,
            entao a imagem e o texto entram como decorativos.
        -->
        <button
            class="navbar__logo"
            type="button"
            (click)="scrollTo('home')"
            aria-label="Alessandro Lima — Home"
        >
            @let isDark = themeService.isDarkTheme();
            <img
                class="navbar__logo-mark"
                [src]="isDark ? 'dragonWhite.svg' : 'dragonBlack.svg'"
                alt=""
                aria-hidden="true"
                width="48"
                height="48"
                decoding="async"
                fetchpriority="high"
            />
            <span class="navbar__logo-name" aria-hidden="true">
                Alessandro <span class="navbar__logo-surname">Lima</span>
            </span>
        </button>

        <nav class="navbar__nav navbar__nav--desktop" aria-label="Primary">
            <ul class="navbar__links">
                <li>
                    <button type="button" (click)="scrollTo('about-me')">
                        {{ 'navAbout' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('work-experience')">
                        {{ 'navWork' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('projects')">
                        {{ 'navProjects' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('certificates')">
                        {{ 'navCertificates' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('contact')">
                        {{ 'navContact' | translate }}
                    </button>
                </li>
            </ul>
            <app-language-switcher></app-language-switcher>
        </nav>

        <button
            class="navbar__toggle"
            type="button"
            (click)="toggleMobileMenu()"
            [attr.aria-expanded]="isMobileMenuOpen()"
            [attr.aria-label]="isMobileMenuOpen() ? 'Close menu' : 'Open menu'"
        >
            <fa-icon
                [icon]="['fas', isMobileMenuOpen() ? 'xmark' : 'bars']"
                aria-hidden="true"
            ></fa-icon>
        </button>
    </div>

    @if (isMobileMenuOpen()) {
        <nav class="navbar__mobile" aria-label="Mobile">
            <ul class="navbar__links navbar__links--mobile">
                <li>
                    <button type="button" (click)="scrollTo('about-me')">
                        {{ 'navAbout' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('work-experience')">
                        {{ 'navWork' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('projects')">
                        {{ 'navProjects' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('certificates')">
                        {{ 'navCertificates' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('contact')">
                        {{ 'navContact' | translate }}
                    </button>
                </li>
            </ul>
            <div class="navbar__mobile-switcher">
                <app-language-switcher></app-language-switcher>
            </div>
        </nav>
    }
</header>
