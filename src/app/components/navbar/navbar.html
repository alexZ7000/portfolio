<nav class="navbar" [class.scrolled]="isScrolled()" [class.menu-open]="isMobileMenuOpen()">
    <div class="navbar-content">
        <div class="logo">
            <img
                [src]="themeService.isDarkTheme() ? 'assets/logoWhite.svg' : 'assets/logoBlack.svg'"
                alt="Logo"
                (click)="scrollTo('home')"
            />
        </div>

        <div class="desktop-menu">
            <ul class="nav-links">
                <li><button (click)="scrollTo('about-me')">{{ 'navAbout' | translate }}</button></li>
                <li><button (click)="scrollTo('work-experience')">{{ 'navWork' | translate }}</button></li>
                <li><button (click)="scrollTo('certificates')">{{ 'navCertificates' | translate }}</button></li>
                <li><button (click)="scrollTo('contact')">{{ 'navContact' | translate }}</button></li>
            </ul>

            <app-language-switcher></app-language-switcher>
        </div>

        <div class="mobile-toggle">
            <button (click)="toggleMobileMenu()" [attr.aria-label]="isMobileMenuOpen() ? 'Close menu' : 'Open menu'">
                <i class="fas" [class.fa-bars]="!isMobileMenuOpen()" [class.fa-times]="isMobileMenuOpen()"></i>
            </button>
        </div>
    </div>

    @if (isMobileMenuOpen()) {
        <div class="mobile-menu">
            <ul class="mobile-nav-links">
                <li><button (click)="scrollTo('about-me')">{{ 'navAbout' | translate }}</button></li>
                <li><button (click)="scrollTo('work-experience')">{{ 'navWork' | translate }}</button></li>
                <li><button (click)="scrollTo('certificates')">{{ 'navCertificates' | translate }}</button></li>
                <li><button (click)="scrollTo('contact')">{{ 'navContact' | translate }}</button></li>
            </ul>
            <div class="mobile-switcher">
                <app-language-switcher></app-language-switcher>
            </div>
        </div>
    }
</nav>
