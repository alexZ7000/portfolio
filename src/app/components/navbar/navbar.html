<header class="navbar" [class.is-scrolled]="isScrolled()" [class.is-menu-open]="isMobileMenuOpen()">
    <div class="navbar__inner">
        <button class="navbar__logo" type="button" (click)="scrollTo('home')" aria-label="Home">
            @let isDark = themeService.isDarkTheme();
            <picture>
                <source
                    type="image/webp"
                    [srcset]="isDark ? 'assets/logoWhite.webp' : 'assets/logoBlack.webp'"
                />
                <img
                    [src]="isDark ? 'assets/logoWhite.png' : 'assets/logoBlack.png'"
                    alt="Alessandro Lima"
                    width="600"
                    height="58"
                    decoding="async"
                    fetchpriority="high"
                />
            </picture>
        </button>

        <nav class="navbar__nav navbar__nav--desktop" aria-label="Primary">
            <ul class="navbar__links">
                <li>
                    <button type="button" (click)="scrollTo('about-me')">
                        {{ 'navAbout' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('work-experience')">
                        {{ 'navWork' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('certificates')">
                        {{ 'navCertificates' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('contact')">
                        {{ 'navContact' | translate }}
                    </button>
                </li>
            </ul>
            <app-language-switcher></app-language-switcher>
        </nav>

        <button
            class="navbar__toggle"
            type="button"
            (click)="toggleMobileMenu()"
            [attr.aria-expanded]="isMobileMenuOpen()"
            [attr.aria-label]="isMobileMenuOpen() ? 'Close menu' : 'Open menu'"
        >
            <fa-icon
                [icon]="['fas', isMobileMenuOpen() ? 'xmark' : 'bars']"
                aria-hidden="true"
            ></fa-icon>
        </button>
    </div>

    @if (isMobileMenuOpen()) {
        <nav class="navbar__mobile" aria-label="Mobile">
            <ul class="navbar__links navbar__links--mobile">
                <li>
                    <button type="button" (click)="scrollTo('about-me')">
                        {{ 'navAbout' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('work-experience')">
                        {{ 'navWork' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('certificates')">
                        {{ 'navCertificates' | translate }}
                    </button>
                </li>
                <li>
                    <button type="button" (click)="scrollTo('contact')">
                        {{ 'navContact' | translate }}
                    </button>
                </li>
            </ul>
            <div class="navbar__mobile-switcher">
                <app-language-switcher></app-language-switcher>
            </div>
        </nav>
    }
</header>
