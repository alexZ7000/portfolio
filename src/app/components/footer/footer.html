<footer class="main-footer">
    <div class="dragon-body-layer layer-back">
        <svg
            class="dragon-svg"
            preserveAspectRatio="none"
            viewBox="0 0 1200 120"
            xmlns="http://www.w3.org/2000/svg"
        >
            <path
                class="dragon-spine"
                d="M0,120 C150,120 200,60 400,60 C600,60 700,100 900,100 C1100,100 1150,80 1200,120 L1200,150 L0,150 Z"
                fill="rgba(0,0,0,0.6)"
            />
        </svg>
    </div>

    <div class="dragon-body-layer layer-front">
        <svg
            class="dragon-svg"
            preserveAspectRatio="none"
            viewBox="0 0 1200 150"
            xmlns="http://www.w3.org/2000/svg"
        >
            <defs>
                <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1" />
                    <stop offset="20%" stop-color="#1a4d3a" stop-opacity="1" />
                    <stop offset="50%" stop-color="#00f2a1" stop-opacity="1" />
                    <stop offset="80%" stop-color="#1a4d3a" stop-opacity="1" />
                    <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1" />
                </linearGradient>
                <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <path
                class="dragon-shape"
                fill="url(#bodyGradient)"
                filter="url(#neonGlow)"
                d="M0,150 C100,150 150,90 300,90 C450,90 500,130 650,130 C800,130 850,70 1000,70 C1100,70 1150,100 1200,150 L1200,200 L0,200 Z"
            />

            <path
                class="scales-detail"
                fill="none"
                stroke="rgba(0,0,0,0.3)"
                stroke-width="2"
                d="M0,150 C100,150 150,90 300,90 C450,90 500,130 650,130 C800,130 850,70 1000,70 C1100,70 1150,100 1200,150"
                transform="translate(0, 10)"
            />
        </svg>
    </div>

    <div class="footer-content">
        <div class="pearl-container">
            <button class="back-to-top" (click)="scrollToTop()" aria-label="Back to Top">
                <div class="pearl-core"></div>
                <i class="fa-solid fa-chevron-up"></i>
            </button>
            <div class="pearl-glow"></div>
        </div>

        <div class="text-group">
            <div class="social-links">
                @for (social of socials; track social.url) {
                    <a
                        [href]="social.url"
                        target="_blank"
                        rel="noopener noreferrer"
                        [attr.aria-label]="social.label"
                    >
                        <i [class]="social.icon"></i>
                    </a>
                }
            </div>

            <div class="copyright">
                <p>{{ 'contactFooter' | translate }}</p>
            </div>
        </div>
    </div>

    <div class="fog-overlay"></div>
</footer>
